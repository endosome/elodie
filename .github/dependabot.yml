# Updates of the base image of the Dockerfile (its digest, i.e. for security
#  updates of Debian and Python 3.12.x) and of the actions of the workflows.
#  The pull requests run CI.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Another version of Python or Debian is changed on purpose, only
      #  updates of 3.12-slim-trixie itself
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

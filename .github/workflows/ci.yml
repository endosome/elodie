name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Run all versions even if one fails to see which are affected
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # Elodie requires 13.49 or higher (see MINIMUM_EXIFTOOL_VERSION), which
      #  Ubuntu does not ship yet. The archive of the official repository's tag.
      EXIFTOOL_VERSION: "13.59"
      EXIFTOOL_SHA256: "87d3317882fdae9cb4dcfe57a96a378d0132ffc02c731315bf128b19ddcf7aac"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            elodie/tests/requirements.txt
            elodie/plugins/googlephotos/requirements.txt

      - name: Install ExifTool
        run: |
          wget -O Image-ExifTool.tar.gz https://github.com/exiftool/exiftool/archive/refs/tags/${EXIFTOOL_VERSION}.tar.gz
          echo "${EXIFTOOL_SHA256}  Image-ExifTool.tar.gz" | sha256sum --check
          tar -xzf Image-ExifTool.tar.gz
          cd exiftool-${EXIFTOOL_VERSION}
          perl Makefile.PL
          make
          sudo make install
          exiftool -ver

      - name: Install dependencies
        run: |
          pip install -r elodie/tests/requirements.txt
          pip install -r elodie/plugins/googlephotos/requirements.txt
          pip install coveralls pytest-cov

      - name: Cache test assets
        # Camera raw files downloaded by the tests from elodie-test-assets
        uses: actions/cache@v6
        with:
          path: elodie/tests/files/raw-*
          key: test-assets-${{ hashFiles('elodie/tests/assets.json') }}

      - name: Enable debug output
        run: sed -i 's/^debug = False/debug = True/' elodie/constants.py

      - name: Run tests
        env:
          # Location tests need a MapQuest key, set it as a repository secret
          ELODIE_MAPQUEST_KEY: ${{ secrets.ELODIE_MAPQUEST_KEY }}
        run: pytest elodie/tests -v --cov=elodie --cov-report=xml

      - name: Run tests in another time zone
        # Dates must not depend on the time zone of the computer, the tests
        #  run in GMT otherwise where local time and UTC are the same
        if: matrix.python-version == '3.12'
        env:
          ELODIE_MAPQUEST_KEY: ${{ secrets.ELODIE_MAPQUEST_KEY }}
          ELODIE_TEST_TZ: America/New_York
        run: pytest elodie/tests -q -n auto --dist loadgroup

      - name: Upload coverage to Coveralls
        # Requires the repository to be enabled on coveralls.io
        if: matrix.python-version == '3.10'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: coveralls --service=github

  immich:
    # The Immich plugin against a real Immich: the oldest supported release
    #  and the latest one, to notice when a new release breaks it.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        immich-version: ["v3.2.2", "release"]
    env:
      EXIFTOOL_VERSION: "13.59"
      EXIFTOOL_SHA256: "87d3317882fdae9cb4dcfe57a96a378d0132ffc02c731315bf128b19ddcf7aac"
      IMMICH_VERSION: ${{ matrix.immich-version }}
      IMMICH_TEST_LIBRARY_PATH: /tmp/immich-library
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            elodie/tests/requirements.txt
            elodie/plugins/immich/requirements.txt

      - name: Start Immich
        # Pulling and starting it takes a while, the next steps run meanwhile
        working-directory: elodie/tests/plugins/immich/server
        run: |
          mkdir -p "$IMMICH_TEST_LIBRARY_PATH"
          docker compose up -d

      - name: Install ExifTool
        run: |
          wget -O Image-ExifTool.tar.gz https://github.com/exiftool/exiftool/archive/refs/tags/${EXIFTOOL_VERSION}.tar.gz
          echo "${EXIFTOOL_SHA256}  Image-ExifTool.tar.gz" | sha256sum --check
          tar -xzf Image-ExifTool.tar.gz
          cd exiftool-${EXIFTOOL_VERSION}
          perl Makefile.PL
          make
          sudo make install
          exiftool -ver

      - name: Install dependencies
        run: |
          pip install -r elodie/tests/requirements.txt
          pip install -r elodie/plugins/immich/requirements.txt

      - name: Set up Immich
        working-directory: elodie/tests/plugins/immich/server
        run: |
          docker compose up -d --wait
          curl -s http://127.0.0.1:2283/api/server/version
          python setup.py --env-file >> "$GITHUB_ENV"

      - name: Run the Immich plugin tests
        run: pytest elodie/tests/plugins/immich -v

      - name: Show the logs of Immich
        if: failure()
        working-directory: elodie/tests/plugins/immich/server
        run: docker compose logs --tail 200 immich-server

  docker:
    # The image runs elodie, the dev image the tests
    runs-on: ubuntu-latest
    env:
      EXIFTOOL_VERSION: "13.59"
      EXIFTOOL_SHA256: "87d3317882fdae9cb4dcfe57a96a378d0132ffc02c731315bf128b19ddcf7aac"
    steps:
      - uses: actions/checkout@v7

      - name: Build the images
        run: |
          docker build --build-arg EXIFTOOL_VERSION --build-arg EXIFTOOL_SHA256 --target dev -t elodie-dev .
          docker build --build-arg EXIFTOOL_VERSION --build-arg EXIFTOOL_SHA256 -t elodie .

      - name: Run the tests in the dev image
        env:
          ELODIE_MAPQUEST_KEY: ${{ secrets.ELODIE_MAPQUEST_KEY }}
        run: docker run --rm -e ELODIE_MAPQUEST_KEY elodie-dev pytest elodie/tests -q -n auto --dist loadgroup

      - name: Check the image
        run: docker/smoke-test.sh elodie

  publish:
    # The image of a release (a tag, i.e. v1.2.3) for amd64 and arm64 (i.e. a
    #  NAS or a Raspberry Pi) after all tests passed, as
    #  ghcr.io/<owner>/elodie. The arm64 image is checked with QEMU.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      EXIFTOOL_VERSION: "13.59"
      EXIFTOOL_SHA256: "87d3317882fdae9cb4dcfe57a96a378d0132ffc02c731315bf128b19ddcf7aac"
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Build the image for arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            EXIFTOOL_VERSION=${{ env.EXIFTOOL_VERSION }}
            EXIFTOOL_SHA256=${{ env.EXIFTOOL_SHA256 }}
          load: true
          tags: elodie:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image for arm64
        # On the oldest 64-bit ARM CPU (ARMv8.0-A, i.e. Raspberry Pi 3), the
        #  image must not need a newer one
        env:
          QEMU_CPU: cortex-a53
        run: docker/smoke-test.sh elodie:arm64 linux/arm64

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels of the image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # 1.2.3, 1.2, 1 and latest for v1.2.3, only the tag for others
          #  (i.e. 1.0.0-alpha1)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag

      - name: Publish the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            EXIFTOOL_VERSION=${{ env.EXIFTOOL_VERSION }}
            EXIFTOOL_SHA256=${{ env.EXIFTOOL_SHA256 }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

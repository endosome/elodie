name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Run all versions even if one fails to see which are affected
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # Geolocation requires a recent ExifTool which Ubuntu does not ship yet
      EXIFTOOL_VERSION: "13.50"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            elodie/tests/requirements.txt
            elodie/plugins/googlephotos/requirements.txt

      - name: Install ExifTool
        run: |
          wget -O Image-ExifTool-${EXIFTOOL_VERSION}.tar.gz https://files.jmathai.com/elodie/Image-ExifTool-${EXIFTOOL_VERSION}.tar.gz
          tar -xzf Image-ExifTool-${EXIFTOOL_VERSION}.tar.gz
          cd Image-ExifTool-${EXIFTOOL_VERSION}
          perl Makefile.PL
          make
          sudo make install
          exiftool -ver

      - name: Install dependencies
        run: |
          pip install -r elodie/tests/requirements.txt
          pip install -r elodie/plugins/googlephotos/requirements.txt
          pip install coveralls pytest-cov

      - name: Cache test assets
        # Camera raw files downloaded by the tests from elodie-test-assets
        uses: actions/cache@v6
        with:
          path: elodie/tests/files/raw-*
          key: test-assets-${{ hashFiles('elodie/tests/assets.json') }}

      - name: Enable debug output
        run: sed -i 's/^debug = False/debug = True/' elodie/constants.py

      - name: Run tests
        env:
          # Location tests need a MapQuest key, set it as a repository secret
          ELODIE_MAPQUEST_KEY: ${{ secrets.ELODIE_MAPQUEST_KEY }}
        run: pytest elodie/tests -v --cov=elodie --cov-report=xml

      - name: Upload coverage to Coveralls
        # Requires the repository to be enabled on coveralls.io
        if: matrix.python-version == '3.10'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: coveralls --service=github
